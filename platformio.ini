[platformio]
default_envs = nicemcu_32s_2_8ips
src_dir = src

[env:nicemcu_32s_2_8ips]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_NICEMCU_28IPS=1
    ; ── TFT_eSPI driver config (NiceMCU 2.8" IPS ST7789) ──
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=12
    -D TFT_RST=2
    ; TFT_BL managed exclusively by HardwareManager (PWM on GPIO 25)
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=0
    ; ── Font loading (Unified Zen PROGMEM fonts + tiny 5x7 GLCD for calendar lunar digits) ──
    -D LOAD_GLCD=1
    ; ── SPI speeds ──
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.1.0
    tzapu/WiFiManager @ ^2.0.17
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.0.0
    ricmoo/QRCode @ ^0.0.1

[env:esp32_cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; ── TFT_eSPI driver config (ESP32-2432S028 CYD) ──
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    ; ── Font loading (Unified Zen PROGMEM fonts + tiny 5x7 GLCD for calendar lunar digits) ──
    -D LOAD_GLCD=1
    ; ── Touch (XPT2046 resistive) ──
    -D TOUCH_CS=33
    ; ── SPI speeds ──
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; NOTE: DMA disabled — DMA region limited to ~110KB,
    ;       insufficient for 16-bit 320×240 sprite (153KB).
    ;       Sprite allocates from full heap (~215KB) for true 16-bit color.

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.1.0
    tzapu/WiFiManager @ ^2.0.17
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.0.0
    ricmoo/QRCode @ ^0.0.1
